; ============================================================================
; PluginPack Sample Configuration
; ============================================================================
; All options below are commented out and set to their default values.
; Copy the options you want to change into your active D2RLoader.ini file,
; uncomment them (remove the leading ;), and set your desired value.
;
; ============================================================================


; ============================================================================
[PluginPack.Items]
; ============================================================================

; ----------------------------------------------------------------------------
; Item Identification on Spawn
; Set to 1 to have items of the given quality spawn already identified.
; ----------------------------------------------------------------------------
;EnableMagicItemsSpawnIdentified=0
;EnableRareItemsSpawnIdentified=0

; ----------------------------------------------------------------------------
; Gold Penalty
; Set to 1 to disable the gold penalty applied on player death.
; ----------------------------------------------------------------------------
;DisableGoldPenalty=0

; ----------------------------------------------------------------------------
; Inventory Gold Limit
; EnableInventoryGoldLimitChange controls the mode:
;   0 = Disabled (vanilla behavior)
;   1 = Flat     - InventoryGoldLimit is the fixed maximum gold you can carry
;   2 = PerLevel - InventoryGoldLimit is a per-level multiplier replacing
;                  the vanilla 10,000 gp/level rate (e.g. 15000 = 15,000/level)
; ----------------------------------------------------------------------------
;EnableInventoryGoldLimitChange=0
;InventoryGoldLimit=10000

; ----------------------------------------------------------------------------
; Runeword Quality Unlock
; By default runewords can only form in Normal-quality socketed items.
; Set any of these to 1 to also allow runewords in items of that quality.
; ----------------------------------------------------------------------------
;RunewordQualityMagic=0
;RunewordQualitySet=0
;RunewordQualityRare=0
;RunewordQualityUnique=0
;RunewordQualityCrafted=0
;RunewordQualityTempered=0

; ----------------------------------------------------------------------------
; Gamble Filter
; GambleFilter controls how the gambling pool is modified:
;   0 = Disabled (vanilla behavior)
;   1 = NoRingAmuletGuarantee - removes the forced ring/amulet from the pool
;   2 = Bitfield - forces the pool to have items with `GamblebitField` set
;                  in their bitfield1 value.
;
; GambleBitfield: the bitmask to test against dwBitField1 (only used when
; GambleFilter=2). Default 4 targets items flagged as gambleable by modders.
; ----------------------------------------------------------------------------
;GambleFilter=0
;GambleBitfield=4

; ----------------------------------------------------------------------------
; Vendor Overhaul
; Replaces the vendor fill logic with a custom system that controls how many
; normal, magic, and rare items vendors stock, and at what level thresholds.
;
; EnableVendorOverhaul=1 must be set for the following options to take effect.
;
; Level thresholds (all based on the computed vendor item level):
;   VendorOverhaulNormalItemLevelMaxLevelThreshold - item level below which
;       normal (non-magic) items are generated (default 25)
;   VendorOverhaulMagicMinLevelThreshold - minimum item level for magic items
;       to be eligible for generation (default 0)
;   VendorOverhaulSuperiorLevelMinLevelThreshold - item level at or above which
;       a normal item can roll Superior quality (default 5)
;   VendorOverhaulLowQualityMaxLevelThreshold - item level below which a normal
;       item can roll Low Quality (default 5)
;
; Upgrade chances (out of 100):
;   VendorOverhaulSuperiorUpgradeChance - percent chance a normal item upgrades
;       to Superior when eligible (default 25)
;   VendorOverhaulLowQualityDowngradeChance - percent chance a normal item
;       downgrades to Low Quality when eligible (default 10)
;
; Rare vendor items:
;   VendorOverhaulEnableRandomRareItems=1 allows magic-slot items to randomly
;       roll Rare quality instead, at the chance below (out of 1024):
;   VendorOverhaulRareItemChance - rolls < this value become Rare (default 0)
; ----------------------------------------------------------------------------
;EnableVendorOverhaul=0
;VendorOverhaulNormalItemLevelMaxLevelThreshold=25
;VendorOverhaulMagicMinLevelThreshold=0
;VendorOverhaulSuperiorLevelMinLevelThreshold=5
;VendorOverhaulLowQualityMaxLevelThreshold=5
;VendorOverhaulSuperiorUpgradeChance=25
;VendorOverhaulLowQualityDowngradeChance=10
;VendorOverhaulEnableRandomRareItems=0
;VendorOverhaulRareItemChance=0

; ----------------------------------------------------------------------------
; Vendor Difficulty Upgrade Thresholds
; Controls the item level formula used by vendors when computing store stock
; on Nightmare and Hell. These patch internal constants in GenerateStoreItem.
;
; The formula per difficulty tier is: itemLevel = (playerLevel * Scale) + Base
; (Scale is rounded down to the nearest power of two; it becomes a bit shift.)
;
; Nightmare/Uber tier (default: Scale=64, Base=4000):
;   VendorNightmareUpgradeLevelScale=64
;   VendorNightmareUpgradeBaseChance=4000
;
; Hell/Ultra tier (default: Scale=16, Base=1000):
;   VendorHellUpgradeLevelScale=16
;   VendorHellUpgradeBaseChance=1000
;
; Hell/Uber tier (default: Scale=128, Base=5000):
;   VendorHellUberUpgradeLevelScale=128
;   VendorHellUberUpgradeBaseChance=5000
;
; Only active when EnableVendorOverhaul=1.
; ----------------------------------------------------------------------------
;VendorNightmareUpgradeBaseChance=4000
;VendorNightmareUpgradeLevelScale=64
;VendorHellUpgradeBaseChance=1000
;VendorHellUpgradeLevelScale=16
;VendorHellUberUpgradeBaseChance=5000
;VendorHellUberUpgradeLevelScale=128

; ----------------------------------------------------------------------------
; Player-Based TreasureClass ConditionCalc
; When enabled, TreasureClassEx rows with UsePlayerForConditionCalc=1 in
; TreasureClassEx.txt will evaluate ConditionCalc expressions using the
; killing player's stats instead of the monster's stats.
; ----------------------------------------------------------------------------
;EnablePlayerConditionCalc=0

; ----------------------------------------------------------------------------
; Resistance Caps
; Override the maximum resistance values enforced by the game.
;
; EnablePhysResistMaxChange=1 sets the physical resistance cap to MaxPhysResist.
; EnableElementalResistMaxChange=1 sets the elemental (fire/cold/lightning/poison)
;   resistance cap to MaxElementalResist.
; EnableAbsorbCapChange=1 sets the absorb percentage cap to MaxAbsorbCapPct.
; ----------------------------------------------------------------------------
;EnablePhysResistMaxChange=0
;MaxPhysResist=50
;EnableElementalResistMaxChange=0
;MaxElementalResist=95
;EnableAbsorbCapChange=0
;MaxAbsorbCapPct=40


; ============================================================================
[PluginPack.Levels]
; ============================================================================

; ----------------------------------------------------------------------------
; Act 1 Dirt Path
; Set to 1 to disable the dirt path tile overlay used in Act 1 outdoor areas.
; ----------------------------------------------------------------------------
;DisableAct1DirtPath=0


; ============================================================================
[PluginPack.Quests]
; ============================================================================
;
; Most quest reward options share a common EnableXxxRewardChange flag:
;   0 = Disabled (vanilla behavior)
;   1 = SamePerDifficulty  - the same reward value is used on all difficulties
;   2 = DifferentPerDifficulty - separate values per difficulty (Normal /
;       Nightmare / Hell) read from keys suffixed Normal, Nightmare, Hell.
;       (e.g. AkaraCainRewardItemNormal, AkaraCainRewardItemNightmare, ...)
;
;
; Quality values use D2R's internal item quality enum:
;   2=Normal  3=Superior  4=Magic  5=Set  6=Rare  7=Unique  8=Crafted  9=Tempered

; ----------------------------------------------------------------------------
; Den of Evil (Act 1 Q1) - skill point reward
; ----------------------------------------------------------------------------
;EnableDenOfEvilRewardChange=0
;DenOfEvilSkillPointReward=1

; ----------------------------------------------------------------------------
; Izual (Act 4 Q3) - skill point reward
; ----------------------------------------------------------------------------
;EnableIzualRewardChange=0
;IzualSkillPointReward=2

; ----------------------------------------------------------------------------
; Lam Esen's Tome / Black Book (Act 3 Q4) - stat point reward
; ----------------------------------------------------------------------------
;EnableBlackBookRewardChange=0
;BlackBookStatPointReward=5

; ----------------------------------------------------------------------------
; Golden Bird (Act 3 Q2) - grants a stat bonus
; GoldenBirdRewardStat: the stat ID to increase (default 7 = MaxLife)
; GoldenBirdRewardAmount: the amount to add.
;     NOTE: Health and mana are calculated in 256ths -- 5120 (the default) = 20.
; ----------------------------------------------------------------------------
;EnableGoldenBirdRewardChange=0
;GoldenBirdRewardStat=7
;GoldenBirdRewardAmount=5120

; ----------------------------------------------------------------------------
; Radament's Lair Skill Book (Act 2 Q1) - stat/skill point reward
; SkillBookRewardStat: the stat ID to increase (default 5 = skill points)
; SkillBookRewardAmount: how many points to award (default 1)
; ----------------------------------------------------------------------------
;EnableRadamentSkillBookRewardChange=0
;RadamentSkillBookRewardStat=5
;RadamentSkillBookRewardAmount=1

; ----------------------------------------------------------------------------
; Akara / Cain (Act 1 Q3) ring reward
; Item code and quality for the ring Akara rewards after rescuing Cain.
; Per-difficulty keys (used when EnableAkaraCainRewardChange=2):
;   AkaraCainRewardItemNormal / AkaraCainRewardItemNightmare / AkaraCainRewardItemHell
;   AkaraCainRewardItemQualityNormal / ... Nightmare / ... Hell
; ----------------------------------------------------------------------------
;EnableAkaraCainRewardChange=0
;AkaraCainRewardItem=rin
;AkaraCainRewardItemQuality=6
;AkaraCainRewardItemNormal=rin
;AkaraCainRewardItemQualityNormal=6
;AkaraCainRewardItemNightmare=rin
;AkaraCainRewardItemQualityNightmare=6
;AkaraCainRewardItemHell=rin
;AkaraCainRewardItemQualityHell=6

; ----------------------------------------------------------------------------
; Ormus / Gidbinn (Act 3 Q2) ring reward
; Item code and quality for the ring Ormus rewards after the Gidbinn quest.
; Per-difficulty keys (used when EnableOrmusGidbinnRewardChange=2):
;   OrmusGidbinnRewardItemNormal / ... Nightmare / ... Hell
;   OrmusGidbinnRewardItemQualityNormal / ... Nightmare / ... Hell
; ----------------------------------------------------------------------------
;EnableOrmusGidbinnRewardChange=0
;OrmusGidbinnRewardItem=rin
;OrmusGidbinnRewardItemQuality=6
;; per difficulty is below
;OrmusGidbinnRewardItemNormal=rin
;OrmusGidbinnRewardItemQualityNormal=6
;OrmusGidbinnRewardItemNightmare=rin
;OrmusGidbinnRewardItemQualityNightmare=6
;OrmusGidbinnRewardItemHell=rin
;OrmusGidbinnRewardItemQualityHell=6

; ----------------------------------------------------------------------------
; Qual-Kehk (Act 5 Q2) rune rewards
; Qual-Kehk gives three rune rewards (one per difficulty slot in SamePerDifficulty
; mode, or three separate slots in DifferentPerDifficulty mode).
; All three reward slots share the key QualKehkRewardItem; use the per-difficulty
; suffixed keys to set different runes per difficulty.
; Defaults: Normal rune slot= 70r, Nightmare= 80r, Hell= 90r
; ----------------------------------------------------------------------------
;EnableQualKehkRewardChange=0
;QualKehkRewardItem1=r07
;QualKehkRewardItem2=r08
;QualKehkRewardItem3=r09
;; per difficulty is below
;QualKehkRewardItem1Normal=r07
;QualKehkRewardItem2Normal=r07
;QualKehkRewardItem3Normal=r07
;QualKehkRewardItem1Nightmare=r08
;QualKehkRewardItem2Nightmare=r08
;QualKehkRewardItem3Nightmare=r08
;QualKehkRewardItem1Hell=r09
;QualKehkRewardItem2Hell=r09
;QualKehkRewardItem3Hell=r09

; ----------------------------------------------------------------------------
; Imbue (Act 1 Q5)
; Set to 1 to allow Charsi's Imbue to work on socketed items (vanilla blocks it).
; ----------------------------------------------------------------------------
;ImbueAllowSocketedItems=0


; ============================================================================
[PluginPack.Skills]
; ============================================================================

; ----------------------------------------------------------------------------
; Alternative Mana Cost Resources
; Allows individual skills to drain Life or Stamina instead of Mana,
; controlled by new boolean columns in skills.txt:
;   ManaCostsLife=1    - skill drains Life  instead of Mana
;   ManaCostsStamina=1 - skill drains Stamina instead of Mana
;
; Enable the hooks for each resource type independently.
; ----------------------------------------------------------------------------
;EnableManaCostsLife=0
;EnableManaCostsStamina=0

; ----------------------------------------------------------------------------
; Classic Whirlwind
; Set to 1 to enable classic WW behavior, which hits every frame.
; ----------------------------------------------------------------------------
;EnableClassicWW=0

; ----------------------------------------------------------------------------
; Whirlwind Chance-to-Cast
; Set to 1 to allow Whirlwind hits to trigger Chance-to-Cast modifiers
; ----------------------------------------------------------------------------
;EnableWWCtC=0

; ----------------------------------------------------------------------------
; Telekinesis Extended Pickup
; Set to 1 to allow Telekinesis to pick up any item on the ground,
; rather than only gold and scrolls.
; ----------------------------------------------------------------------------
;EnableTelekinesisPicksUpEverything=0

; ----------------------------------------------------------------------------
; Charged Item Drain Avoidance
; When enabled, reads a custom stat (ChargedPctDrainStat) from the player.
; The stat number in this INI should correspond to what's in ItemStatCost.txt.
; The stat's value (0-100) is treated as a percentage chance to NOT consume
; a charge when a charged-item skill is activated.
; ----------------------------------------------------------------------------
;EnableChargedPctDrainStat=0
;ChargedPctDrainStat=0
